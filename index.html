<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Game Hub - 100+ Games</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header>
    <h1>🎮 GAME HUB</h1>
    <p>100+ Games • Online & Offline</p>

    <input
      type="text"
      id="search"
      placeholder="🔎 Search games..."
      onkeyup="searchGames()"
    >
  </header>

  <nav class="categories">
    <button onclick="showCategory('all')">All</button>
    <button onclick="showCategory('board')">♟️ Board</button>
    <button onclick="showCategory('action')">🔫 Action</button>
    <button onclick="showCategory('racing')">🏎️ Racing</button>
    <button onclick="showCategory('sports')">🏏 Sports</button>
    <button onclick="showCategory('zombie')">🧟 Zombie</button>
    <button onclick="showCategory('runner')">🏃 Runner</button>
  </nav>

  <main>

    <h2>🔥 Popular Games</h2>

    <div class="games">

      <div class="game" data-category="board">
        <div class="game-icon">🎲</div>
        <h3>Ludo</h3>
        <p>Board Game</p>
        <button onclick="playGame('Ludo')">▶ Play Now</button>
      </div>

      <div class="game" data-category="board">
        <div class="game-icon">♟️</div>
        <h3>Chess</h3>
        <p>Strategy Game</p>
        <button onclick="playGame('Chess')">▶ Play Now</button>
      </div>

      <div class="game" data-category="board">
        <div class="game-icon">🪜</div>
        <h3>Snake & Ladder</h3>
        <p>Board Game</p>
        <button onclick="playGame('Snake & Ladder')">▶ Play Now</button>
      </div>

      <div class="game" data-category="sports">
        <div class="game-icon">🏏</div>
        <h3>Cricket Battle</h3>
        <p>Sports Game</p>
        <button onclick="playGame('Cricket Battle')">▶ Play Now</button>
      </div>

      <div class="game" data-category="action">
        <div class="game-icon">🔫</div>
        <h3>Gun Shooter</h3>
        <p>Action Game</p>
        <button onclick="playGame('Gun Shooter')">▶ Play Now</button>
      </div>

      <div class="game" data-category="runner">
        <div class="game-icon">🏃</div>
        <h3>Super Runner</h3>
        <p>Endless Runner</p>
        <button onclick="playGame('Super Runner')">▶ Play Now</button>
      </div>

      <div class="game" data-category="zombie">
        <div class="game-icon">🧟</div>
        <h3>Zombie Apocalypse</h3>
        <p>Survival Game</p>
        <button onclick="playGame('Zombie Apocalypse')">▶ Play Now</button>
      </div>

      <div class="game" data-category="racing">
        <div class="game-icon">🏎️</div>
        <h3>Speed Racing</h3>
        <p>Racing Game</p>
        <button onclick="playGame('Speed Racing')">▶ Play Now</button>
      </div>

    </div>

  </main>

  <script src="script.js"></script>

</body>
</html>
